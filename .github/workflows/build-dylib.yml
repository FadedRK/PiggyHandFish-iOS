name: Build iOS dylib

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piggyhandfish-dylib
  cancel-in-progress: true

jobs:
  build:
    name: Build PiggyHandFish dylib
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos (same toolchain family as ZolaCN)
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Build dylib
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make
          mkdir -p dist

          ARM64="$(find .theos/obj -type f -path '*/arm64/PiggyHandFish.dylib' -print -quit)"
          ARM64E="$(find .theos/obj -type f -path '*/arm64e/PiggyHandFish.dylib' -print -quit)"

          if [[ -z "$ARM64" ]]; then
            echo "Theos did not produce the arm64 dylib." >&2
            find .theos/obj -type f -name '*.dylib' -print || true
            exit 1
          fi

          if [[ -n "$ARM64E" ]]; then
            lipo -create "$ARM64" "$ARM64E" -output dist/PiggyHandFish.dylib
          else
            cp "$ARM64" dist/PiggyHandFish.dylib
          fi

          file dist/PiggyHandFish.dylib
          lipo -info dist/PiggyHandFish.dylib
          test -s dist/PiggyHandFish.dylib
          shasum -a 256 dist/PiggyHandFish.dylib | tee dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiggyHandFish-iOS-${{ github.sha }}
          path: |
            dist/PiggyHandFish.dylib
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
