name: Build PiggyHandFish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piggyhandfish-build
  cancel-in-progress: true

jobs:
  build:
    name: Build main PiggyHandFish dylib
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Build main dylib
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make PiggyHandFish
          mkdir -p dist

          arm64="$(find .theos/obj -type f -path '*/arm64/PiggyHandFish.dylib' -print -quit)"
          arm64e="$(find .theos/obj -type f -path '*/arm64e/PiggyHandFish.dylib' -print -quit)"

          if [[ -z "$arm64" ]]; then
            echo 'Theos did not produce arm64 PiggyHandFish.dylib.' >&2
            find .theos/obj -type f -name '*.dylib' -print || true
            exit 1
          fi

          if [[ -n "$arm64e" ]]; then
            lipo -create "$arm64" "$arm64e" -output dist/PiggyHandFish.dylib
          else
            cp "$arm64" dist/PiggyHandFish.dylib
          fi

          install_name_tool -id '@rpath/PiggyHandFish.dylib' dist/PiggyHandFish.dylib
          file dist/PiggyHandFish.dylib
          lipo -info dist/PiggyHandFish.dylib
          test -s dist/PiggyHandFish.dylib
          shasum -a 256 dist/PiggyHandFish.dylib | tee dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload main plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiggyHandFish-${{ github.sha }}
          path: |
            dist/PiggyHandFish.dylib
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
