name: Build PiggyHandFish settings entry and diagnostics

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piggyhandfish-diagnostic-dylibs
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin, capture, and load-probe dylibs
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Build standalone diagnostic dylibs
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make
          mkdir -p dist

          build_universal() {
            local target="$1"
            local output="$2"
            local arm64 arm64e

            arm64="$(find .theos/obj -type f -path "*/arm64/${target}.dylib" -print -quit)"
            arm64e="$(find .theos/obj -type f -path "*/arm64e/${target}.dylib" -print -quit)"

            if [[ -z "$arm64" ]]; then
              echo "Theos did not produce arm64 ${target}.dylib." >&2
              find .theos/obj -type f -name '*.dylib' -print || true
              exit 1
            fi

            if [[ -n "$arm64e" ]]; then
              lipo -create "$arm64" "$arm64e" -output "$output"
            else
              cp "$arm64" "$output"
            fi

            install_name_tool -id "@rpath/$(basename "$output")" "$output"
            file "$output"
            lipo -info "$output"
            test -s "$output"
          }

          build_universal PiggyHandFish dist/PiggyHandFish.dylib
          build_universal PiggyHandFishCapture dist/PiggyHandFish-Capture.dylib
          build_universal PiggyHandFishProbe dist/PiggyHandFish-LoadProbe.dylib

          shasum -a 256 dist/PiggyHandFish.dylib dist/PiggyHandFish-Capture.dylib dist/PiggyHandFish-LoadProbe.dylib | tee dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PiggyHandFish-Diagnostics-${{ github.sha }}
          path: |
            dist/PiggyHandFish.dylib
            dist/PiggyHandFish-Capture.dylib
            dist/PiggyHandFish-LoadProbe.dylib
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
